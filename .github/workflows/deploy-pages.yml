name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/life-tracker-app-roadmap-49xta0]
    paths: ["app/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # No `environment: github-pages` block here on purpose: GitHub
    # auto-creates that environment with a deployment-branch rule limited
    # to the default branch the first time Pages is enabled, which would
    # block deploys from any other branch. Omitting it removes that gate;
    # pages:write + id-token:write permissions above are all deploy-pages
    # actually needs to publish.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload app/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
