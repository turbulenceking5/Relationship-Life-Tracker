<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Life Tracker</title>
  <meta name="description" content="Track shared events, expenses, rent, and goals with tasks and documents with your partner." />
  <meta name="theme-color" content="#b3654a" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#090c11" media="(prefers-color-scheme: dark)" />
  <script>
    // Applies a forced light/dark theme before first paint, so there's no
    // flash of the wrong theme while app.js (an ES module, which runs
    // after this) loads. Leaves the attribute unset for 'auto' (the
    // default), letting the CSS media query follow the OS setting as
    // before. See app/js/theme.js for the settings-sheet toggle.
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Life Tracker" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <div class="spinner-overlay" id="boot-loading">Loading…</div>
  </div>

  <script src="js/vendor/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
