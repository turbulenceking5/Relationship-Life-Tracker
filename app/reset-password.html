<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Reset password — Life Tracker</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#b3654a" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-screen" id="content">
    <h1>Checking…</h1>
    <p class="lead">One moment.</p>
  </div>

  <script src="js/vendor/supabase.js"></script>
  <script type="module">
    import { supabase } from './js/supabaseClient.js';

    const content = document.getElementById('content');

    function renderMessage(title, message, showButton) {
      content.innerHTML = '';
      const h1 = document.createElement('h1');
      h1.textContent = title;
      const p = document.createElement('p');
      p.className = 'lead';
      p.textContent = message;
      content.appendChild(h1);
      content.appendChild(p);
      if (showButton) {
        const a = document.createElement('a');
        a.href = 'index.html';
        a.className = 'btn primary';
        a.style.display = 'block';
        a.style.textAlign = 'center';
        a.style.textDecoration = 'none';
        a.style.boxSizing = 'border-box';
        a.textContent = 'Open Life Tracker';
        content.appendChild(a);
      }
    }

    function renderForm() {
      content.innerHTML = '';
      const h1 = document.createElement('h1');
      h1.textContent = 'Choose a new password';
      const p = document.createElement('p');
      p.className = 'lead';
      p.textContent = 'At least 6 characters.';

      const form = document.createElement('form');
      const field = document.createElement('div');
      field.className = 'field';
      const label = document.createElement('label');
      label.textContent = 'New password';
      const input = document.createElement('input');
      input.type = 'password';
      input.required = true;
      input.minLength = 6;
      input.autocomplete = 'new-password';
      input.placeholder = 'At least 6 characters';
      field.appendChild(label);
      field.appendChild(input);

      const errorEl = document.createElement('div');
      errorEl.className = 'error-msg';
      errorEl.style.display = 'none';

      const submitBtn = document.createElement('button');
      submitBtn.type = 'submit';
      submitBtn.className = 'btn primary';
      submitBtn.textContent = 'Save new password';

      form.appendChild(field);
      form.appendChild(errorEl);
      form.appendChild(submitBtn);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving…';
        try {
          const { error } = await supabase.auth.updateUser({ password: input.value });
          if (error) throw error;
          renderMessage('Password updated ❤️', 'You can now open the app — you’re already signed in.', true);
        } catch (err) {
          errorEl.textContent = err.message || 'Something went wrong';
          errorEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Save new password';
        }
      });

      content.appendChild(h1);
      content.appendChild(p);
      content.appendChild(form);
    }

    // Clicking the password-reset email link lands here with recovery
    // tokens in the URL; supabase-js processes them on client creation and
    // establishes a session automatically (same origin/localStorage as
    // index.html), same as the email-confirmation flow in confirmed.html.
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        renderForm();
      } else {
        renderMessage('Link expired or already used', 'Head back to the app and request a new password reset link from the login screen.', true);
      }
    });
  </script>
</body>
</html>
